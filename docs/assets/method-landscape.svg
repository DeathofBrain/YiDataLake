<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">异构数据源元数据方法谱系</title>
  <desc id="desc">从原始数据源到元数据控制层再到下游分析的五类现有方法，以及未覆盖的端到端缺口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px 'Microsoft YaHei',sans-serif;fill:#0f172a}.sub{font:400 14px 'Microsoft YaHei',sans-serif;fill:#475569}
      .stage{font:700 16px 'Microsoft YaHei',sans-serif;fill:#0f172a}.cardTitle{font:700 16px 'Microsoft YaHei',sans-serif;fill:#0f172a}
      .body{font:400 13px 'Microsoft YaHei',sans-serif;fill:#334155}.small{font:400 12px 'Microsoft YaHei',sans-serif;fill:#64748b}
      .pill{font:700 12px 'Microsoft YaHei',sans-serif;fill:#fff}.gap{font:700 15px 'Microsoft YaHei',sans-serif;fill:#9f1239}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="48" y="48" class="title">异构数据源元数据方法谱系</text>
  <text x="48" y="76" class="sub">综合改绘：依据 ResearchVault 中 Evaporate、Starmie、ALITE、QueryArtisan、LOTUS、CADENZA 等论文机制</text>

  <rect x="48" y="112" width="210" height="64" rx="8" fill="#0f766e"/>
  <text x="153" y="140" text-anchor="middle" class="pill">原始异构源</text>
  <text x="153" y="160" text-anchor="middle" class="pill">PDF / HTML / JSON / 表 / 图片</text>
  <line x1="258" y1="144" x2="310" y2="144" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="102" width="420" height="84" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="330" y="130" class="stage">元数据与候选发现</text>
  <text x="330" y="154" class="body">catalog / schema profile / 列嵌入 / unionable-jointable 表</text>
  <text x="330" y="174" class="small">Starmie、SANTOS、D3L、JOSIE、LEDD</text>

  <line x1="730" y1="144" x2="782" y2="144" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="782" y="102" width="270" height="84" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="917" y="130" text-anchor="middle" class="stage">字段/视图抽取</text>
  <text x="917" y="154" text-anchor="middle" class="body">schema 发现 + 抽取函数</text>
  <text x="917" y="174" text-anchor="middle" class="small">Evaporate / DocETL</text>

  <line x1="1052" y1="144" x2="1104" y2="144" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1104" y="102" width="248" height="84" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1228" y="130" text-anchor="middle" class="stage">对齐与集成</text>
  <text x="1228" y="154" text-anchor="middle" class="body">schema matching / entity join</text>
  <text x="1228" y="174" text-anchor="middle" class="small">TURL / ALITE / Magellan</text>

  <text x="48" y="235" class="stage">现有路线的能力边界</text>
  <rect x="48" y="258" width="1304" height="292" rx="12" fill="#fff" stroke="#cbd5e1"/>

  <rect x="76" y="292" width="236" height="120" rx="8" fill="#ecfeff" stroke="#14b8a6"/>
  <text x="194" y="320" text-anchor="middle" class="cardTitle">源内抽取</text>
  <text x="92" y="346" class="body">发现属性、抽取值、生成结构化视图</text>
  <text x="92" y="370" class="body">优点：可复用函数、成本摊销</text>
  <text x="92" y="394" class="body">缺点：漂移、长尾字段、跨源对齐</text>
  <rect x="120" y="428" width="148" height="24" rx="12" fill="#0f766e"/><text x="194" y="445" text-anchor="middle" class="pill">Evaporate</text>

  <rect x="336" y="292" width="236" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="454" y="320" text-anchor="middle" class="cardTitle">数据发现</text>
  <text x="352" y="346" class="body">表/列语义表示、检索、层次目录</text>
  <text x="352" y="370" class="body">优点：规模化候选生成</text>
  <text x="352" y="394" class="body">缺点：不是字段事实抽取</text>
  <rect x="404" y="428" width="100" height="24" rx="12" fill="#2563eb"/><text x="454" y="445" text-anchor="middle" class="pill">Starmie</text>

  <rect x="596" y="292" width="236" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="714" y="320" text-anchor="middle" class="cardTitle">表集成</text>
  <text x="612" y="346" class="body">列对齐、Full Disjunction、实体匹配</text>
  <text x="612" y="370" class="body">优点：保留可连接事实</text>
  <text x="612" y="394" class="body">缺点：对齐错误会传播</text>
  <rect x="674" y="428" width="80" height="24" rx="12" fill="#d97706"/><text x="714" y="445" text-anchor="middle" class="pill">ALITE</text>

  <rect x="856" y="292" width="216" height="120" rx="8" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="964" y="320" text-anchor="middle" class="cardTitle">查询/计划生成</text>
  <text x="872" y="346" class="body">元数据增强、算子图、代码生成</text>
  <text x="872" y="370" class="body">优点：减少预建 ETL</text>
  <text x="872" y="394" class="body">缺点：LLM 时延与验证成本</text>
  <rect x="900" y="428" width="128" height="24" rx="12" fill="#7c3aed"/><text x="964" y="445" text-anchor="middle" class="pill">QueryArtisan</text>

  <rect x="1096" y="292" width="228" height="120" rx="8" fill="#fff1f2" stroke="#fb7185"/>
  <text x="1210" y="320" text-anchor="middle" class="cardTitle">语义任务优化</text>
  <text x="1112" y="346" class="body">typed DAG、路由、质量/成本</text>
  <text x="1112" y="370" class="body">优点：计划可检查、可调优</text>
  <text x="1112" y="394" class="body">缺点：不负责原始源接入</text>
  <rect x="1156" y="428" width="108" height="24" rx="12" fill="#e11d48"/><text x="1210" y="445" text-anchor="middle" class="pill">CADENZA</text>

  <path d="M 76 500 H 1324" stroke="#e11d48" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="700" y="532" text-anchor="middle" class="gap">缺口：统一 source → field → entity → relation → evidence 的控制面与端到端评测</text>

  <rect x="48" y="590" width="1304" height="104" rx="12" fill="#0f172a"/>
  <text x="72" y="620" class="pill">建议研究增量</text>
  <text x="72" y="648" class="pill">版本化 profile + 证据 lineage + 不确定性状态 + 两级路由 + typed DAG + 局部重跑</text>
  <text x="72" y="674" class="small" fill="#cbd5e1">目标不是替代上述方法，而是把它们纳入一个可验证、可恢复、可审计的 Metadata Control Plane。</text>
</svg>
